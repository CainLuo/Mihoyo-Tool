<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>角色详情原型</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #080810;
        color: #e8e8f0;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        background: #111118;
        border-bottom: 1px solid #2a2a3a;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        flex-wrap: wrap;
      }
      .bar span {
        color: #888;
        font-size: 12px;
      }
      .btn {
        padding: 3px 10px;
        border-radius: 6px;
        border: 1px solid #333;
        background: #1a1a28;
        color: #aaa;
        font-size: 11px;
        cursor: pointer;
        line-height: 1.6;
        transition: all 0.2s;
      }
      .btn.on {
        background: #3a6fd8;
        border-color: #3a6fd8;
        color: #fff;
      }
      .btn:hover:not(.on) {
        border-color: #555;
        color: #ddd;
      }
      .wrap {
        margin-top: 52px;
        display: flex;
        justify-content: center;
        padding: 20px 16px;
      }
      .screen {
        border: 2px solid #2a2a3a;
        border-radius: 12px;
        overflow: hidden;
      }
      .sw {
        display: flex;
        align-items: center;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        padding: 7px 10px;
        gap: 5px;
        overflow-x: auto;
        scrollbar-width: none;
        flex-shrink: 0;
      }
      .sw::-webkit-scrollbar {
        display: none;
      }
      .arr {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        flex-shrink: 0;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 13px;
        color: #aaa;
      }
      .th {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        flex-shrink: 0;
        border: 2px solid transparent;
        cursor: pointer;
        overflow: hidden;
        background: linear-gradient(135deg, #3a2a08, #5a3a10);
      }
      .th img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .th.on {
        border-color: #4fc3f7;
        box-shadow: 0 0 8px rgba(79, 195, 247, 0.5);
      }
      .sy {
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      }
      .sy::-webkit-scrollbar {
        width: 3px;
      }
      .sy::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
      }
      .tag {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(79, 195, 247, 0.12);
        color: #4fc3f7;
        border: 1px solid rgba(79, 195, 247, 0.2);
      }
      .rb {
        font-size: 10px;
        color: #ffca28;
        background: rgba(255, 202, 40, 0.15);
        padding: 1px 5px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <span>设备：</span>
      <button class="btn on" onclick="go('pp')">Phone 竖屏<br />360x780</button>
      <button class="btn" onclick="go('pl')">Phone 横屏<br />780x360</button>
      <button class="btn" onclick="go('fd')">Foldable<br />932x600</button>
      <button class="btn" onclick="go('tf')">TripleFold<br />1200x600</button>
      <button class="btn" onclick="go('tb')">Tablet<br />1024x768</button>

    </div>

<script>
// ── enka 风格宽屏圣遗物行 ─────────────────────────────────────────────
// 布局：左侧图标+主词条数值+星级+强化 | 右侧2列×2行副词条
function relRowEnka(r, accent) {
  var subs = "";
  for (var i = 0; i < r.s.length; i++) {
    subs += '<div style="display:flex;justify-content:space-between;align-items:center;padding:2px 6px;gap:4px">'
          + '<span style="font-size:10px;color:rgba(255,255,255,.55);white-space:nowrap">' + r.s[i][0] + '</span>'
          + '<span style="font-size:11px;font-weight:600;color:#fff;white-space:nowrap">' + r.s[i][1] + '</span>'
          + '</div>';
  }
  // flex:1 让5个 cell 等分父容器高度，border-bottom 分隔线
  return '<div style="flex:1;display:flex;align-items:stretch;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.15);min-height:0">'
       // 左侧：图标+主词条
       + '<div style="width:90px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 6px;border-right:1px solid rgba(255,255,255,.06)">'
       + '<div style="font-size:24px;line-height:1">' + r.i + '</div>'
       + '<div style="font-size:9px;color:rgba(255,255,255,.5);margin-top:2px">' + r.mnLabel + '</div>'
       + '<div style="font-size:16px;font-weight:700;color:#fff;line-height:1.1">' + r.mv + '</div>'
       + '<div style="margin-top:2px">' + stars(r.stars) + '</div>'
       + '<div style="font-size:9px;color:rgba(255,255,255,.4)">+' + r.lv + '</div>'
       + '</div>'
       // 右侧：2列×2行副词条，垂直居中
       + '<div style="flex:1;display:grid;grid-template-columns:1fr 1fr;align-content:center">'
       + subs
       + '</div>'
       + '</div>';
}

// ── enka 宽屏属性列表（带基础值+加成双行）────────────────────────────
function apListEnka(accent) {
  var rows = [
    {icon:"💧", label:"生命值",   val:C.hp.toLocaleString(), base:C.hpBase.toLocaleString(), bonus:"+"+C.hpBonus.toLocaleString()},
    {icon:"⚔️", label:"攻击力",   val:C.atk.toLocaleString(), base:C.atkBase.toLocaleString(), bonus:"+"+C.atkBonus.toLocaleString()},
    {icon:"🛡️", label:"防御力",   val:C.def.toLocaleString(), base:C.defBase.toLocaleString(), bonus:"+"+C.defBonus.toLocaleString()},
    {icon:"🌿", label:"元素精通", val:C.em, base:null, bonus:null},
    {icon:"💥", label:"暴击率",   val:C.cr+"%", base:null, bonus:null, hi:true},
    {icon:"💢", label:"暴击伤害", val:C.cd+"%", base:null, bonus:null, hi:true},
    {icon:"⚡", label:"元素充能", val:C.er+"%", base:null, bonus:null}
  ];
  var h = "";
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    h += '<div style="display:flex;align-items:center;padding:6px 14px;border-bottom:1px solid rgba(255,255,255,.05)">'
       + '<span style="font-size:14px;margin-right:8px;flex-shrink:0">' + r.icon + '</span>'
       + '<span style="font-size:12px;color:rgba(255,255,255,.7);flex:1">' + r.label + '</span>'
       + '<div style="text-align:right">'
       + '<div style="font-size:14px;font-weight:600;color:' + (r.hi ? accent : "#fff") + '">' + r.val + '</div>'
       + (r.base ? '<div style="font-size:10px;color:rgba(255,255,255,.4)">' + r.base + ' <span style="color:rgba(255,255,255,.5)">' + r.bonus + '</span></div>' : '')
       + '</div></div>';
  }
  return h;
}

// ── Phone 竖屏 ────────────────────────────────────────────────────────
function renderPP(bh) {
  var heroH = 260;
  var hero = '<div style="height:' + heroH + 'px;flex-shrink:0;position:relative;background:linear-gradient(150deg,#0a1e38,#0e0e22);overflow:hidden">'
           + '<img src="' + C.img + '" style="position:absolute;right:0;bottom:0;height:100%;object-fit:cover;opacity:.9" onerror="this.style.display=\'none\'">'
           + '<div style="position:absolute;inset:0;background:linear-gradient(to right,#0c1a30 0%,rgba(12,26,48,.88) 32%,rgba(12,26,48,.4) 55%,transparent 100%)"></div>'
           + '<div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(10,16,30,.9) 0%,transparent 45%)"></div>'
           + '<div style="position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;z-index:3">' + consCol() + '</div>'
           + '<div style="position:absolute;left:12px;bottom:10px;z-index:2;max-width:calc(100% - 52px)">'
           + '<div style="font-size:22px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.9);line-height:1.2">' + C.name + '</div>'
           + '<div style="font-size:12px;color:#ccc;margin-top:4px;display:flex;align-items:center;gap:6px">Lv.' + C.level + ' <span class="tag">好感 ' + C.fetter + '</span></div>'
           + '<div style="display:flex;gap:10px;margin-top:8px;padding-bottom:2px">' + sklsRowPhone() + '</div>'
           + '</div></div>';
  // 滚动区：武器 + 属性 + 圣遗物，内容可超出屏幕高度正常滚动
  var relHtml = "";
  for (var i = 0; i < C.relics.length; i++) {
    relHtml += relCardPhone(C.relics[i]);
  }
  var body = '<div class="sy" style="flex:1;min-height:0;padding:10px;display:flex;flex-direction:column;gap:8px">'
           + wpnRowPhone() + apGrid(2)
           + '<div style="font-size:11px;color:#888;padding-top:2px">圣遗物</div>'
           + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:start">'
           + relHtml + '</div>'
           + '<div style="height:10px;flex-shrink:0"></div>'
           + '</div>';
  // 外层容器必须是 flex column，sw 固定，内容区 flex:1 才能正确填满并滚动
  return '<div style="display:flex;flex-direction:column;width:100%;height:100%;background:#0d0d18">'
       + sw()
       + '<div style="display:flex;flex-direction:column;flex:1;min-height:0">' + hero + body + '</div>'
       + '</div>';
}

// ── Phone 横屏 ────────────────────────────────────────────────────────
function renderPL(bh) {
  var hero = '<div style="width:200px;flex-shrink:0;position:relative;background:linear-gradient(150deg,#0a1e38,#0e0e22);overflow:hidden">'
           + '<img src="' + C.img + '" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center top;opacity:.9" onerror="this.style.display=\'none\'">'
           + '<div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(10,16,30,1) 0%,rgba(10,16,30,.7) 40%,rgba(10,16,30,.1) 65%,transparent 100%)"></div>'
           + '<div style="position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;z-index:3">' + consCol() + '</div>'
           + '<div style="position:absolute;left:10px;bottom:8px;z-index:2;max-width:calc(100% - 38px)">'
           + '<div style="font-size:15px;font-weight:700;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.9);line-height:1.2">' + C.name + '</div>'
           + '<div style="font-size:10px;color:#ccc;margin-top:3px;display:flex;align-items:center;gap:4px">Lv.' + C.level + ' <span class="tag">好感 ' + C.fetter + '</span></div>'
           + '<div style="display:flex;gap:8px;margin-top:6px;padding-bottom:2px">' + sklsRowPhone() + '</div>'
           + '</div></div>';
  var relHtml = "";
  for (var i = 0; i < C.relics.length; i++) {
    relHtml += relCardPhone(C.relics[i]);
  }
  var body = '<div class="sy" style="flex:1;min-width:0;min-height:0;padding:8px;display:flex;flex-direction:column;gap:6px">'
           + wpnRowPhone() + apGrid(4)
           + '<div style="font-size:11px;color:#888;padding-top:2px">圣遗物</div>'
           + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;align-items:start">'
           + relHtml + '</div>'
           + '<div style="height:8px;flex-shrink:0"></div>'
           + '</div>';
  // 外层容器必须是 flex column，sw 固定，内容行 flex:1 才能正确填满
  return '<div style="display:flex;flex-direction:column;width:100%;height:100%;background:#0d0d18">'
       + sw()
       + '<div style="display:flex;flex:1;min-height:0">' + hero + body + '</div>'
       + '</div>';
}

// ── enka 宽屏布局（三等分 + spacing）────────────────────────────────
function renderEnka(bh) {
  var elem = getElem();
  var accent = elem.accent;
  var gap = 8; // 栏间距

  // 命座：左下角，从1到6从上到下竖排
  var consHtml = '<div style="display:flex;flex-direction:column;gap:5px">' + consCol() + '</div>';

  // 技能：右下角，只取前3个（普攻/战技/爆发），从上到下竖排
  var sklHtml = '<div style="display:flex;flex-direction:column;gap:6px">';
  for (var si = 0; si < 3; si++) {
    var sk = C.skills[si];
    sklHtml += '<div style="display:flex;flex-direction:column;align-items:center;gap:2px">'
             + '<div style="width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);'
             + 'border:1.5px solid rgba(255,255,255,.25);display:flex;align-items:center;'
             + 'justify-content:center;font-size:14px">' + sk.i + '</div>'
             + '<span style="font-size:10px;color:' + accent + ';font-weight:700">' + sk.lv + '</span>'
             + '</div>';
  }
  sklHtml += '</div>';

  // 左栏：立绘铺满，左上角名字+等级+好感，左下角命座，右下角技能
  var left = '<div style="flex:1;min-width:0;position:relative;overflow:hidden;border-radius:8px;background:' + elem.bg + '">'
           // 立绘：铺满整个区域
           + '<img src="' + C.img + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;opacity:.95" onerror="this.style.display=\'none\'">'
           // 渐变遮罩：上下两端压暗
           + '<div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.6) 0%,transparent 30%,transparent 55%,rgba(0,0,0,.75) 100%)"></div>'
           // 左上角：角色名 + 等级 + 好感
           + '<div style="position:absolute;left:12px;top:12px;z-index:2">'
           + '<div style="font-size:18px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.9);line-height:1.2">' + C.name + '</div>'
           + '<div style="font-size:11px;color:rgba(255,255,255,.75);margin-top:4px">Lv.' + C.level + '/' + C.maxLevel + '</div>'
           + '<div style="font-size:11px;color:' + accent + ';margin-top:2px">❤ 好感 ' + C.fetter + '</div>'
           + '</div>'
           // 左下角：命座（1→6 从上到下）
           + '<div style="position:absolute;left:12px;bottom:12px;z-index:2">' + consHtml + '</div>'
           // 右下角：技能（普攻/战技/爆发，从上到下）
           + '<div style="position:absolute;right:12px;bottom:12px;z-index:2">' + sklHtml + '</div>'
           + '</div>';

  // 中栏：武器 + 属性列表（无套装行）
  var mid = '<div style="flex:1;min-width:0;display:flex;flex-direction:column;border-radius:8px;background:rgba(0,0,0,.35);overflow:hidden">'
          // 武器区
          + '<div style="padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0">'
          + '<div style="display:flex;align-items:center;gap:10px">'
          + '<img style="width:52px;height:52px;object-fit:contain;flex-shrink:0;border-radius:6px;background:rgba(255,255,255,.06)" src="' + C.wpn.icon + '">'
          + '<div style="flex:1;min-width:0">'
          + '<div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + C.wpn.name + '</div>'
          + '<div style="display:flex;align-items:center;gap:8px;margin-top:3px">'
          + '<span style="font-size:11px;color:rgba(255,255,255,.6)">⚔️ ' + C.wpn.atk + '</span>'
          + '<span style="font-size:11px;color:' + accent + '">💥 ' + C.wpn.subVal + '</span>'
          + '</div>'
          + '<div style="display:flex;align-items:center;gap:6px;margin-top:3px">'
          + '<span class="rb">R' + C.wpn.af + '</span>'
          + '<span style="font-size:10px;color:rgba(255,255,255,.5)">Lv.' + C.wpn.lv + '/' + C.wpn.maxLv + '</span>'
          + '</div>'
          + '</div></div>'
          + '<div style="margin-top:6px">' + stars(C.wpn.stars) + '</div>'
          + '</div>'
          // 属性列表（可滚动）
          + '<div class="sy" style="flex:1">' + apListEnka(accent) + '</div>'
          + '</div>';

  // 右栏：圣遗物列表，5个等分高度
  var relics = '<div style="flex:1;min-width:0;border-radius:8px;background:rgba(0,0,0,.25);overflow:hidden;display:flex;flex-direction:column">';
  for (var i = 0; i < C.relics.length; i++) {
    relics += relRowEnka(C.relics[i], accent);
  }
  relics += '</div>';

  // 三栏等分，外层加 padding 作为 spacing，flex:1 自适应剩余高度
  return '<div style="display:flex;flex-direction:column;width:100%;height:100%;background:' + elem.bg + '">'
       + sw()
       + '<div style="flex:1;min-height:0;display:flex;overflow:hidden;padding:' + gap + 'px;gap:' + gap + 'px">'
       + left + mid + relics
       + '</div>'
       + '</div>';
}

// ── 路由 ──────────────────────────────────────────────────────────────
function render(dev) {
  var d = DEVS[dev];
  var bh = d[1] - 44;
  if (dev === "pp") return renderPP(bh);
  if (dev === "pl") return renderPL(bh);
  return renderEnka(bh);
}

function go(dev) {
  var btns = document.querySelectorAll(".btn");
  var keys = Object.keys(DEVS);
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle("on", keys[i] === dev);
  }
  var d = DEVS[dev];
  var s = document.getElementById("S");
  s.style.width = d[0] + "px";
  s.style.height = d[1] + "px";
  s.style.display = "flex";
  s.style.flexDirection = "column";
  s.innerHTML = render(dev);
}

go("pp");
</script>
</body>
</html>
