<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>Home NavBar Prototype</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #080810;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        background: #111118;
        border-bottom: 1px solid #2a2a3a;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        flex-wrap: wrap;
      }
      .btn {
        padding: 3px 10px;
        border-radius: 6px;
        border: 1px solid #333;
        background: #1a1a28;
        color: #aaa;
        font-size: 11px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn.on {
        background: #3a6fd8;
        border-color: #3a6fd8;
        color: #fff;
      }
      .sep {
        color: #444;
        font-size: 11px;
        padding: 0 4px;
      }
      .wrap {
        margin-top: 52px;
        display: flex;
        justify-content: center;
        padding: 20px 16px;
      }
      .screen {
        border: 2px solid #2a2a3a;
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        flex-shrink: 0;
      }
      .note {
        color: #666;
        font-size: 11px;
        padding: 0 6px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <button class="btn on" onclick="go('light', 'pp')">
        浅色<br />360×780
      </button>
      <button class="btn" onclick="go('dark', 'pp')">深色<br />360×780</button>
      <span class="sep">|</span>
      <button class="btn" onclick="go('light', 'fd')">
        浅色宽屏<br />932×600
      </button>
      <button class="btn" onclick="go('dark', 'fd')">
        深色宽屏<br />932×600
      </button>
      <span class="sep">|</span>
      <span class="note">↑ Phone 模式下滚动内容可看 NavBar 渐变效果</span>
    </div>
    <div class="wrap"><div class="screen" id="S"></div></div>
    <script>
      var DEVS = { pp: [360, 780], fd: [932, 600] };

      function makeCSS(isDark) {
        var pageBg = isDark ? "#0D0D14" : "#F2F2F7";
        var cardBg = isDark ? "#1A1A28" : "#FFFFFF";
        var navSolid = isDark ? "rgba(20,20,32,.92)" : "rgba(242,242,247,.92)";
        var textPri = isDark ? "#E8E8F0" : "#000000";
        var textSec = isDark ? "#888898" : "#6C6C70";
        var divider = isDark ? "rgba(255,255,255,.08)" : "rgba(0,0,0,.1)";
        var border = isDark ? "rgba(255,255,255,.06)" : "rgba(0,0,0,.06)";
        var tabBg = isDark ? "rgba(20,20,32,.92)" : "rgba(242,242,247,.92)";
        var tabIcon = isDark ? "#888898" : "#8E8E93";
        var tabOn = isDark ? "#4A90D9" : "#007AFF";
        var shadow = isDark ? "rgba(0,0,0,.4)" : "rgba(0,0,0,.08)";
        var progBg = isDark ? "rgba(255,255,255,.12)" : "#E5E5EA";

        return (
          "<style>" +
          "*{box-sizing:border-box;margin:0;padding:0}" +
          'html,body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;height:100%}' +
          ".page{display:flex;flex-direction:column;overflow:hidden;position:relative;height:100%;background:" +
          pageBg +
          "}" +
          /* NavBar — Phone only, overlays content */
          ".nb{position:absolute;top:0;left:0;right:0;z-index:10;height:56px;display:flex;align-items:center;padding:0 4px 0 16px;transition:background .25s,box-shadow .25s}" +
          ".nb.clear{background:transparent}" +
          ".nb.solid{background:" +
          navSolid +
          ";backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 .5px 0 " +
          divider +
          "}" +
          ".nb-title{font-size:17px;font-weight:600;color:" +
          textPri +
          ";opacity:0;transition:opacity .2s;flex:1;text-align:center}" +
          ".nb.solid .nb-title{opacity:1}" +
          ".nb-right{display:flex;align-items:center}" +
          ".nb-icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:" +
          tabOn +
          "}" +
          /* Wide NavBar — fixed, always visible */
          ".wnb{height:56px;flex-shrink:0;display:flex;align-items:center;padding:0 4px 0 16px;background:" +
          navSolid +
          ";backdrop-filter:blur(20px)}" +
          ".wnb-title{font-size:17px;font-weight:600;color:" +
          textPri +
          ";flex:1}" +
          /* Scroll */
          ".sa{flex:1;overflow-y:auto;scrollbar-width:none}" +
          ".sa::-webkit-scrollbar{display:none}" +
          ".pad{padding:8px 16px 32px}" +
          /* Big title — Phone only, inside scroll */
          ".big-title{font-size:34px;font-weight:700;color:" +
          textPri +
          ";padding:8px 4px 16px}" +
          /* Section header */
          ".sec-hd{font-size:13px;color:" +
          textSec +
          ";padding:0 4px 8px 4px}" +
          /* Game card */
          ".gcard{background:" +
          cardBg +
          ";border-radius:16px;border:1px solid " +
          border +
          ";box-shadow:0 2px 8px " +
          shadow +
          ";overflow:hidden;margin-bottom:12px}" +
          ".gcard-hd{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}" +
          ".gbar{width:4px;border-radius:2px;flex-shrink:0}" +
          ".gcard-name{font-size:16px;font-weight:500;color:" +
          textPri +
          ";flex:1}" +
          ".gcard-sub{font-size:13px;color:" +
          textSec +
          "}" +
          ".gcard-sync{font-size:13px;color:" +
          textSec +
          ";white-space:nowrap}" +
          ".gdivider{height:.5px;background:" +
          divider +
          ";margin:0 12px}" +
          ".gcard-body{padding:8px 12px 12px}" +
          ".res-label{font-size:13px;color:" +
          textSec +
          ";margin-bottom:3px}" +
          ".res-row{display:flex;align-items:center;gap:8px}" +
          ".res-val{font-size:28px;font-weight:700;line-height:1}" +
          ".res-max{font-size:16px;color:" +
          textSec +
          ";margin-bottom:2px}" +
          ".sec-row{display:flex;align-items:center;margin-top:8px}" +
          ".sec-label{font-size:13px;color:" +
          textSec +
          "}" +
          ".sec-val{font-size:13px;color:" +
          textPri +
          ";margin-left:auto}" +
          /* TabBar */
          ".tabbar{height:50px;background:" +
          tabBg +
          ";backdrop-filter:blur(20px);display:flex;flex-shrink:0}" +
          ".tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}" +
          ".tab-icon{font-size:20px;color:" +
          tabIcon +
          "}" +
          ".tab-label{font-size:10px;color:" +
          tabIcon +
          "}" +
          ".tab.on .tab-icon,.tab.on .tab-label{color:" +
          tabOn +
          "}" +
          /* Sidebar */
          ".sidebar{width:200px;background:" +
          navSolid +
          ";border-right:.5px solid " +
          divider +
          ";display:flex;flex-direction:column;padding:8px 0;flex-shrink:0}" +
          ".sb-item{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;font-size:15px;color:" +
          textSec +
          ";border-radius:10px;margin:0 8px}" +
          ".sb-item.on{color:" +
          tabOn +
          ";background:rgba(74,144,217,.12)}" +
          ".sb-icon{font-size:18px}" +
          "</style>"
        );
      }

      function gameCard(
        color,
        gameName,
        roleInfo,
        syncText,
        resLabel,
        resCur,
        resMax,
        secLabel,
        secVal,
        isFull,
      ) {
        var ratio = resMax > 0 ? Math.min(resCur / resMax, 1) : 0;
        var resColor = isFull ? "#FF3B30" : ratio >= 0.875 ? "#FF9500" : color;
        var circ = 132,
          dash = Math.round(ratio * circ);
        var ring =
          '<svg width="52" height="52" style="transform:rotate(-90deg)">' +
          '<circle cx="26" cy="26" r="21" fill="none" stroke="rgba(128,128,128,.2)" stroke-width="5"/>' +
          '<circle cx="26" cy="26" r="21" fill="none" stroke="' +
          resColor +
          '" stroke-width="5"' +
          ' stroke-dasharray="' +
          dash +
          " " +
          circ +
          '" stroke-linecap="round"/>' +
          "</svg>";
        return (
          '<div class="gcard">' +
          '<div class="gcard-hd">' +
          '<div class="gbar" style="height:36px;background:' +
          color +
          '"></div>' +
          '<div style="flex:1;min-width:0"><div class="gcard-name">' +
          gameName +
          '</div><div class="gcard-sub">' +
          roleInfo +
          "</div></div>" +
          '<div class="gcard-sync">' +
          syncText +
          "</div>" +
          "</div>" +
          '<div class="gdivider"></div>' +
          '<div class="gcard-body">' +
          '<div class="res-label">' +
          resLabel +
          "</div>" +
          '<div class="res-row">' +
          '<div style="flex:1;display:flex;align-items:flex-end;gap:4px">' +
          '<span class="res-val" style="color:' +
          resColor +
          '">' +
          resCur +
          "</span>" +
          '<span class="res-max">/' +
          resMax +
          "</span>" +
          "</div>" +
          ring +
          "</div>" +
          '<div class="sec-row"><span class="sec-label">' +
          secLabel +
          '</span><span class="sec-val">' +
          secVal +
          "</span></div>" +
          "</div></div>"
        );
      }

      function cards() {
        return (
          gameCard(
            "#4A90D9",
            "原神",
            "旅行者 · 天空岛",
            "刚刚",
            "原粹树脂",
            140,
            160,
            "每日委托奖励",
            "4/4",
            false,
          ) +
          gameCard(
            "#9B72CF",
            "星穹铁道",
            "开拓者 · 星际和平",
            "刚刚",
            "开拓力",
            180,
            240,
            "每日实训",
            "4/4",
            false,
          ) +
          gameCard(
            "#F5A623",
            "绝区零",
            "绳匠 · 艾利都",
            "刚刚",
            "体力",
            240,
            240,
            "周期任务",
            "4/7",
            true,
          )
        );
      }

      function render(isDark, w, h) {
        var css = makeCSS(isDark);
        var tabOn = isDark ? "#4A90D9" : "#007AFF";

        if (w >= 600) {
          /* 宽屏：侧边栏 + 固定 NavBar，内容区无大标题 */
          return (
            css +
            '<div class="page" style="width:' +
            w +
            "px;height:" +
            h +
            'px;flex-direction:row">' +
            '<div class="sidebar">' +
            '<div class="sb-item on"><span class="sb-icon">🏠</span>首页</div>' +
            '<div class="sb-item"><span class="sb-icon">⚔️</span>角色</div>' +
            '<div class="sb-item"><span class="sb-icon">👤</span>我的</div>' +
            "</div>" +
            '<div style="flex:1;display:flex;flex-direction:column;overflow:hidden">' +
            '<div class="wnb">' +
            '<span class="wnb-title">首页</span>' +
            '<div class="nb-icon">↻</div>' +
            "</div>" +
            '<div class="sa"><div class="pad">' +
            '<div class="sec-hd">账号 · 182692936</div>' +
            cards() +
            "</div></div>" +
            "</div></div>"
          );
        }

        /* Phone：NavBar 浮在内容上方，默认透明，滚过大标题后变毛玻璃 */
        return (
          css +
          '<div class="page" style="width:' +
          w +
          "px;height:" +
          h +
          'px">' +
          '<div class="nb clear" id="nb">' +
          '<span class="nb-title">首页</span>' +
          '<div class="nb-right"><div class="nb-icon">↻</div></div>' +
          "</div>" +
          '<div class="sa" id="sa" onscroll="onScroll(this)">' +
          '<div class="pad" style="padding-top:64px">' +
          '<div class="big-title">首页</div>' +
          '<div class="sec-hd">账号 · 182692936</div>' +
          cards() +
          "</div></div>" +
          '<div class="tabbar">' +
          '<div class="tab on"><div class="tab-icon">🏠</div><div class="tab-label">首页</div></div>' +
          '<div class="tab"><div class="tab-icon">⚔️</div><div class="tab-label">角色</div></div>' +
          '<div class="tab"><div class="tab-icon">👤</div><div class="tab-label">我的</div></div>' +
          "</div></div>"
        );
      }

      function onScroll(el) {
        var nb = el.parentElement.querySelector("#nb");
        if (!nb) return;
        nb.className = el.scrollTop > 52 ? "nb solid" : "nb clear";
      }

      function go(mode, dev) {
        var btns = document.querySelectorAll(".btn");
        var keys = ["light-pp", "dark-pp", "light-fd", "dark-fd"];
        var cur = mode + "-" + dev;
        for (var i = 0; i < btns.length; i++)
          btns[i].classList.toggle("on", keys[i] === cur);
        var d = DEVS[dev];
        var s = document.getElementById("S");
        s.style.width = d[0] + "px";
        s.style.height = d[1] + "px";
        s.innerHTML = render(mode === "dark", d[0], d[1]);
      }
      go("light", "pp");
    </script>
  </body>
</html>
