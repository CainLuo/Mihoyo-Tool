<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>米悠悠 v2.0 材料计算原型</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080810;
        color: #e8e8f0;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
      }
      #topbar {
        background: #111118;
        border-bottom: 1px solid #2a2a3a;
        padding: 0 14px;
        height: 40px;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        overflow-x: auto;
        scrollbar-width: none;
      }
      #topbar::-webkit-scrollbar {
        display: none;
      }
      #pagebar {
        background: #0d0d18;
        border-bottom: 1px solid #1a1a2a;
        padding: 0 14px;
        height: 36px;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        overflow-x: auto;
        scrollbar-width: none;
        transition: height 0.15s;
      }
      #pagebar::-webkit-scrollbar {
        display: none;
      }
      #pagebar.empty {
        height: 0;
        border: none;
        padding: 0;
      }
      #main {
        flex: 1;
        display: flex;
        overflow: hidden;
        min-height: 0;
      }
      #sidebar {
        width: 160px;
        flex-shrink: 0;
        background: #0a0a14;
        border-right: 1px solid #1a1a2a;
        overflow-y: auto;
        padding: 8px 0;
      }
      #sidebar::-webkit-scrollbar {
        width: 3px;
      }
      #sidebar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
      }
      .nav-group {
        padding: 8px 12px 3px;
        font-size: 10px;
        color: #444;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .nav-item {
        padding: 7px 16px;
        font-size: 13px;
        color: #888;
        cursor: pointer;
        transition: all 0.15s;
        border-left: 2px solid transparent;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nav-item:hover {
        color: #ccc;
        background: rgba(255, 255, 255, 0.03);
      }
      .nav-item.on {
        color: #4da3ff;
        background: rgba(77, 163, 255, 0.08);
        border-left-color: #4da3ff;
      }
      #preview {
        flex: 1;
        overflow: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #080810;
      }
      #preview::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      #preview::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }
      #S {
        border: 2px solid #2a2a3a;
        border-radius: 12px;
        overflow: hidden;
        flex-shrink: 0;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      }
      .sep {
        width: 1px;
        height: 22px;
        background: #2a2a3a;
        margin: 0 2px;
        flex-shrink: 0;
      }
      .lbl {
        color: #666;
        font-size: 11px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .btn {
        padding: 2px 10px;
        border-radius: 5px;
        border: 1px solid #333;
        background: #1a1a28;
        color: #aaa;
        font-size: 11px;
        cursor: pointer;
        line-height: 1.6;
        transition: all 0.15s;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .btn.on {
        background: #3a6fd8;
        border-color: #3a6fd8;
        color: #fff;
      }
      .btn:hover:not(.on) {
        border-color: #555;
        color: #ddd;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <span class="lbl">设备：</span>
        <button class="btn on" id="d-pp" onclick="setDev('pp')">
          Phone 竖屏 360×780
        </button>
        <button class="btn" id="d-pl" onclick="setDev('pl')">
          Phone 横屏 780×360
        </button>
        <button class="btn" id="d-fd" onclick="setDev('fd')">
          Foldable 932×600
        </button>
        <button class="btn" id="d-tf" onclick="setDev('tf')">
          TripleFold 1200×600
        </button>
        <button class="btn" id="d-tb" onclick="setDev('tb')">
          Tablet 1024×768
        </button>
        <button class="btn" id="d-pc" onclick="setDev('pc')">
          2in1/PC 1440×900
        </button>
        <div class="sep"></div>
        <span class="lbl">主题：</span>
        <button class="btn on" id="t-dark" onclick="setTheme('dark')">
          🌙 Dark
        </button>
        <button class="btn" id="t-light" onclick="setTheme('light')">
          ☀️ Light
        </button>
      </div>
      <div id="pagebar" class="empty"></div>
      <div id="main">
        <div id="sidebar">
          <div class="nav-group">v2.0 材料计算</div>
          <div class="nav-item" id="nav-tools" onclick="setPage('tools')">
            工具页
          </div>

          <div class="nav-item" id="nav-char-detail-entry" onclick="setPage('char-detail-entry')">
            入口示例：角色详情页
          </div>
          <div class="nav-item" id="nav-material-calc" onclick="setPage('material-calc')">
            材料计算
          </div>
          <div class="nav-item" id="nav-material-list" onclick="setPage('material-list')">
            材料汇总
          </div>
        </div>
        <div id="preview"><div id="S"></div></div>
      </div>
    </div>
    <script src="shared.js"></script>
    <script src="device-shell.js"></script>
    <script src="split-layout.js"></script>
    <script src="pages/tools.js"></script>
    <script src="pages/character-detail-entry.js"></script>

    <script src="pages/material-calc.js"></script>
    <script src="pages/material-list-data.js"></script>
    <script src="pages/material-list-utils.js"></script>
    <script src="pages/material-list-render.js"></script>
    <script src="pages/material-list-card.js"></script>
    <script src="pages/material-list-controls.js"></script>
    <script src="index-logic.js"></script>
  </body>
</html>
